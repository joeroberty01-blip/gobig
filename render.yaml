# Render test deployment (pre-Play Store). Frankfurt, next to the Neon database (eu-central-1).
# Secrets are `sync: false`: Render asks for them in the dashboard; they are never stored here.
services:
  - type: web
    name: gobig
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: APP_URL
        value: https://gobig-jfcp.onrender.com
      - key: S3_REGION
        value: eu-central-1
      - key: S3_MEDIA_BUCKET
        value: provider-media
      - key: S3_PRIVATE_BUCKET
        value: verification-docs
      # Phase 19 (SEC-052, measured 2026-09-28): Render appends to X-Forwarded-For behind two proxies
      # (Cloudflare + Render), so the visitor is the 3rd address from the right.
      - key: TRUSTED_PROXY_HOPS
        value: "3"
      # Keep model spend small while testing.
      - key: AI_DAILY_CALL_CAP
        value: "200"
      # Set in the dashboard (secret or environment-specific):
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      # Phase 16/17: encrypts exact trip locations and recipient phones. Rides & deliveries stay
      # switched off until it is set (32 random bytes, base64 — Render's "Generate" gives one).
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Phase C: Web Push keys (`npx web-push generate-vapid-keys`). Push is off until both are set.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ANALYTICS_SALT
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
